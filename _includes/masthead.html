<header class="masthead">
  <div class="wrap masthead__inner">
    <a class="masthead__brand" href="{{ '/' | relative_url }}">
      <span class="masthead__sigil" aria-hidden="true">PL</span>
      <span class="masthead__name">{{ site.title }}</span>
    </a>

    <button class="iconbtn navtoggle" type="button"
            aria-expanded="false" aria-controls="primary-nav" aria-label="Menu"
            style="margin-left:auto">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round"/>
      </svg>
    </button>

    <nav class="masthead__nav" id="primary-nav" aria-label="Primary">
      {%- for item in site.data.nav -%}
        {%- assign here = false -%}
        {%- if page.url == item.url -%}{%- assign here = true -%}{%- endif -%}
        {%- if item.url == '/notes/' and page.layout == 'post' -%}{%- assign here = true -%}{%- endif -%}
        <a class="navlink" href="{{ item.url | relative_url }}"
           {% if here %}aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor -%}
    </nav>

    <div class="masthead__tools">
      <button class="iconbtn" type="button" id="theme-toggle"
              aria-label="Switch between light and dark" title="Switch theme">
        <svg viewBox="0 0 24 24" aria-hidden="true" data-icon="sun">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round"/>
        </svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" data-icon="moon" hidden>
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
</header>
