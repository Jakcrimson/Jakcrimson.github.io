# Institutions Pierre has worked with or studied at.
#
# `id`       stable slug — referenced by posts (`affiliation:`) and by _data/cv.yml
# `logo`     path under /assets/img/logos/. If the file is missing the component
#            falls back to `short` rendered as a typographic wordmark, so the page
#            never shows a broken image.
# `kind`     lab | university | company | agency  (drives the filter on /work/)

- id: inria
  name: Inria
  full: Institut national de recherche en sciences et technologies du numérique
  short: Inria
  kind: lab
  logo: /assets/img/logos/inria.svg
  url: https://www.inria.fr/en
  location: Rennes, France

