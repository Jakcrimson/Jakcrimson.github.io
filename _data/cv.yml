# Career record. Single source of truth for /work/, /cv/ and the home page.
# Every `institution` / `with` entry must match an `id` in _data/institutions.yml.
#
# `start` / `end` are YYYY-MM. `end: ` (empty) means "present".
# `affiliation` is the key posts use to attach themselves to an entry. It is
# separate from `institution` on purpose: an entry can name an organisation
# without claiming every post filed under that organisation.

