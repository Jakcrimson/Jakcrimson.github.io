---
layout: default
---

<div class="wrap {% if page.wide %}{% else %}wrap--prose{% endif %}">
  <header class="pagehead">
    {%- if page.kicker %}<span class="label pagehead__kicker">{{ page.kicker }}</span>{% endif %}
    <h1 class="pagehead__title">{{ page.title }}</h1>
    {%- if page.lede %}<p class="pagehead__lede">{{ page.lede }}</p>{% endif %}
  </header>

  <div class="prose">
    {{ content }}
  </div>
</div>
