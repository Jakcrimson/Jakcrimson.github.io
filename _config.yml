# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------

plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-archives
  - jekyll-redirect-from

markdown: kramdown
highlighter: rouge

kramdown:
  auto_ids: true
  toc_levels: 2..3
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: false

sass:
  style: compressed
  sass_dir: _sass

# Topic pages are generated from the controlled vocabulary in _data/taxonomy.yml.
jekyll-archives:
  enabled: [tags]
  layouts:
    tag: topic
  permalinks:
    tag: /topics/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /posts/:title/
  - scope:
      path: "assets/img/favicons"
    values:
      sitemap: false

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - package.json
  - package-lock.json
  - gulpfile.js
  - requirements.txt
  - update_deepml_stats.py
  - node_modules
  - tools
  - vendor
  - _javascript
  - "*.gem"
  - "*.gemspec"
